name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "manuals/**"
      - "landing/**"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "manuals/**"
      - "landing/**"
  workflow_dispatch:

# Only keep the latest run per branch — older ones are cancelled (saves minutes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check app tests
      - name: Mypy (scoped)
        run: mypy --config-file mypy.ini app/infrastructure/branding_storage.py app/infrastructure/persistence/fts.py app/infrastructure/jobs app/application/use_cases/users/departure.py
      - name: Import check
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: python -c "from app.main import app; print(app.title)"
      - name: Pytest
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: pytest -q --tb=short

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b --pretty false
      - name: ESLint
        run: npm run lint
      - run: npm run build

  # Heavy: only on PRs / manual — every push to main already rebuilds via Publish GHCR on tags.
  docker:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build compose images
        run: docker compose build
