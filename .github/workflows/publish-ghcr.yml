name: Publish GHCR

# Build and push API + frontend images to GitHub Container Registry.
# Triggers: git tags v* (Release) and workflow_dispatch.
# Tags: latest (+ semver major / major.minor / full version on v* tags).
# Pull:
#   docker pull ghcr.io/<owner>/mailarchive-api:latest
#   docker pull ghcr.io/<owner>/mailarchive-frontend:latest
# Or: docker compose -f docker-compose.prod.yml up -d
#
# Not on every push to main — that burned private-repo Actions minutes.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./backend
            image_suffix: mailarchive-api
          - name: frontend
            context: ./frontend
            image_suffix: mailarchive-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: meta_name
        run: echo "image=ghcr.io/${{ github.repository_owner }}/${{ matrix.image_suffix }}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta_name.outputs.image }}
          # latest on Release tags (v*) or manual run from default branch
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
