name: Publish GHCR

# Build and push API + frontend images to GitHub Container Registry.
# Tags: latest (on main), and the git tag when pushing v* tags.
# Pull (public package or with a GHCR token):
#   docker pull ghcr.io/<owner>/mailarchive-api:latest
#   docker pull ghcr.io/<owner>/mailarchive-frontend:latest
# Or: docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./backend
            image_suffix: mailarchive-api
          - name: frontend
            context: ./frontend
            image_suffix: mailarchive-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: meta_name
        run: echo "image=ghcr.io/${{ github.repository_owner }}/${{ matrix.image_suffix }}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta_name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
