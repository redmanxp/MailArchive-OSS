[mypy]
python_version = 3.11
pretty = true
show_error_codes = true
warn_unused_ignores = true
ignore_missing_imports = true

[mypy-app.infrastructure.branding_storage]
disallow_untyped_defs = true

[mypy-app.infrastructure.persistence.fts]
disallow_untyped_defs = true

[mypy-app.infrastructure.jobs.*]
disallow_untyped_defs = true
