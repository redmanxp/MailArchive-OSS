[mypy]
python_version = 3.11
pretty = true
show_error_codes = true
warn_unused_ignores = true
ignore_missing_imports = true
# Scoped CI only type-checks listed modules; do not walk the whole app.
follow_imports = skip

[mypy-app.infrastructure.branding_storage]
disallow_untyped_defs = true

[mypy-app.infrastructure.persistence.fts]
disallow_untyped_defs = true

[mypy-app.infrastructure.jobs.*]
disallow_untyped_defs = true

[mypy-app.application.use_cases.users.departure]
disallow_untyped_defs = true
