# MailArchive — reverse proxy archivos.newlici.com (HTTP, mismo patrón que agente.local / remitos.local)
# OAuth Microsoft requiere HTTPS: cuando haya cert, agregar bloque 443 o usar certbot.
#
# Instalar:
#   sudo cp deploy/nginx-archivos.newlici.com.conf /etc/nginx/sites-available/archivos.newlici.com
#   sudo ln -sf /etc/nginx/sites-available/archivos.newlici.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Callback OAuth (Entra): https://archivos.newlici.com/api/v1/accounts/microsoft/oauth/callback
# → requiere TLS en 443 (certbot o cert interno) antes de vincular M365 en producción.

server {
    listen 80;
    listen [::]:80;
    server_name archivos.newlici.com;

    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://127.0.0.1:18100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:18100/health;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:5175;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
