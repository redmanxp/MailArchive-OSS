# MailArchive — nginx HTTP + HTTPS (certificado autofirmado, patrón vpn_admin)
#
# 1) bash scripts/generate-ssl-cert.sh
# 2) sudo cp deploy/nginx-archivos.newlici.com.https.conf /etc/nginx/sites-available/archivos.newlici.com
# 3) sudo nginx -t && sudo systemctl reload nginx
#
# OAuth callback Entra:
#   https://archivos.newlici.com/api/v1/accounts/microsoft/oauth/callback
#
# El navegador mostrará aviso de certificado la primera vez (normal en LAN).

server {
    listen 80;
    listen [::]:80;
    server_name archivos.newlici.com;

    client_max_body_size 50m;

    location /api/ {
        include snippets/proxy_http_defaults.conf;
        proxy_pass http://127.0.0.1:18100;
    }

    location /health {
        include snippets/proxy_http_defaults.conf;
        proxy_pass http://127.0.0.1:18100/health;
    }

    location / {
        include snippets/proxy_http_defaults.conf;
        proxy_pass http://127.0.0.1:5175;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name archivos.newlici.com;

    ssl_certificate     /etc/nginx/ssl/mailarchive/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/mailarchive/privkey.pem;

    client_max_body_size 50m;

    location /api/ {
        include snippets/proxy_http_defaults.conf;
        proxy_pass http://127.0.0.1:18100;
    }

    location /health {
        include snippets/proxy_http_defaults.conf;
        proxy_pass http://127.0.0.1:18100/health;
    }

    location / {
        include snippets/proxy_http_defaults.conf;
        proxy_pass http://127.0.0.1:5175;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
