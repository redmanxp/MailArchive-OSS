# MailArchive — reverse proxy example (HTTP)
#
# Install:
#   sudo cp deploy/nginx-mailarchive.conf /etc/nginx/sites-available/mailarchive
#   sudo ln -sf /etc/nginx/sites-available/mailarchive /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace mailarchive.example.com with your hostname.
# Microsoft OAuth typically requires HTTPS (see nginx-mailarchive.https.conf).

server {
    listen 80;
    listen [::]:80;
    server_name mailarchive.example.com;

    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://127.0.0.1:18100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:18100/health;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:5175;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
