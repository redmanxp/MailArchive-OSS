# MailArchive — nginx HTTP + HTTPS example
#
# 1) bash scripts/generate-ssl-cert.sh 127.0.0.1 mailarchive.example.com
# 2) sudo cp deploy/nginx-mailarchive.https.conf /etc/nginx/sites-available/mailarchive
# 3) sudo nginx -t && sudo systemctl reload nginx
#
# OAuth callback (Entra):
#   https://mailarchive.example.com/api/v1/accounts/microsoft/oauth/callback

server {
    listen 80;
    listen [::]:80;
    server_name mailarchive.example.com;

    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://127.0.0.1:18100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:18100/health;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:5175;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mailarchive.example.com;

    ssl_certificate     /etc/nginx/ssl/mailarchive/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/mailarchive/privkey.pem;

    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://127.0.0.1:18100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:18100/health;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:5175;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
