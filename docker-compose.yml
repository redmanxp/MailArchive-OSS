# MailArchive — local / OSS stack
#
# SQLite (default, no external DB):
#   docker compose up --build
#   UI: http://localhost:8080
#
# MySQL:
#   docker compose --profile mysql up --build
# MinIO (S3 lab):
#   docker compose --profile minio up -d
#   Settings → Datos → Object storage: endpoint http://minio:9000, user/pass minioadmin

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mailarchive-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      BIND_HOST: 0.0.0.0
      BIND_PORT: "18100"
      DB_ENGINE: ${DB_ENGINE:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/mailarchive.db}
      STORAGE_ROOT: /storage
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      APP_URL: ${APP_URL:-http://localhost:8080}
      API_URL: ${API_URL:-http://localhost:8080}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-http://localhost:8080/api/v1/accounts/microsoft/oauth/callback}
      FEATURE_PUBLIC_REGISTER: ${FEATURE_PUBLIC_REGISTER:-false}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-mailarchive}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-db-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mailarchive}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-filesystem}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-mailarchive}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_PREFIX: ${S3_PREFIX:-}
    volumes:
      - mailarchive_data:/data
      - mailarchive_storage:/storage
    ports:
      - "18100:18100"
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      minio:
        condition: service_started
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18100/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mailarchive-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

  mysql:
    profiles: ["mysql"]
    image: mysql:8.4
    container_name: mailarchive-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mailarchive}
      MYSQL_USER: ${MYSQL_USER:-mailarchive}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-db-password}
    ports:
      - "3307:3306"
    volumes:
      - mailarchive_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-change-me-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Object storage lab: docker compose --profile minio up -d
  # Then Settings → Datos → S3 with endpoint http://minio:9000 (from API container)
  # or http://127.0.0.1:9000 if configuring from host docs.
  minio:
    profiles: ["minio"]
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: mailarchive-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - mailarchive_minio_data:/data

volumes:
  mailarchive_data:
  mailarchive_storage:
  mailarchive_mysql_data:
  mailarchive_minio_data:
